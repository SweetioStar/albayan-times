<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Albayan Times</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/ticker.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- DYNAMIC HEADER -->
    <div id="site-header"></div>

    <!-- FEATURED SWIPER HERO -->
    <section class="featured-hero-section">
        <div class="swiper featuredSwiper">
            <div class="swiper-wrapper" id="hero-swiper-wrapper">
                <!-- Slides injected by js/home-loader.js -->
            </div>
            <!-- Add Pagination -->
            <div class="swiper-pagination"></div>
            <!-- Add Navigation -->
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </section>

    <!-- STARS ON STAGE — grouped by grade -->
    <section class="stars-stage-section">
        <div class="container">

            <div class="stars-stage-header">
                <span class="stars-week-label" id="stars-week-label">This Week</span>
                <h2>Meet This Week's English Stars</h2>
                <p>One outstanding English student from every class. Updated every week — check back to see who shines next.</p>
            </div>

            <div id="stars-stage-container">
                <!-- Populated by js/home-loader.js -->
            </div>

        </div>
    </section>

    <!-- LATEST NEWS -->
    <section class="home-news-section">
        <div class="container">

            <div class="home-news-header">
                <h2>Latest News</h2>
                <a href="html/news.html" class="news-header-link">View All News</a>
            </div>

            <div class="home-news-list" id="latest-news-list">
                <!-- Populated by js/home-loader.js -->
            </div>

        </div>
    </section>

    <!-- DYNAMIC FOOTER -->
    <div id="site-footer"></div>

    <!-- SCRIPTS -->
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/main.js"></script>
    <script src="js/home-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

</body>
</html>
