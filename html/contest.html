<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contests &amp; Competitions | Albayan Times</title>
    <link rel="icon" href="../assets/images/logo/albayan-logo.jpg">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/ticker.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/comments.css">
    <link rel="stylesheet" href="../css/contest.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- DYNAMIC HEADER -->
    <div id="site-header"></div>

    <!-- HERO BANNER (Only 1 banner) -->
    <section class="page-hero">
        <div class="container">
            <div class="page-hero-inner">
                <span class="page-hero-label">Celebrating Talent</span>
                <h2 id="contest-hero-title">Contests &amp; Competitions</h2>
                <p class="page-hero-subtitle" id="contest-hero-subtitle">School competitions held at Albayan, and contests where students send in their work.</p>
            </div>
        </div>
    </section>

    <!-- CONTESTS GRID -->
    <section class="contests-section">
        <div class="container">
            <div class="contest-tabs" role="tablist">
                <button type="button" class="contest-tab" role="tab" data-tab="competitions">School Competitions</button>
                <button type="button" class="contest-tab" role="tab" data-tab="contests">Online Contests</button>
            </div>
            <p class="contest-tab-intro" id="contest-tab-intro"></p>
            <div class="contests-grid" id="contests-grid">
                <!-- Cards injected by script -->
                <div class="empty-state">
                    <h3>Loading contests...</h3>
                </div>
            </div>
        </div>
    </section>

    <!-- DYNAMIC FOOTER -->
    <div id="site-footer"></div>

    <!-- SCRIPTS -->
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/main.js"></script>

    <script>
    (function () {
        'use strict';

        const PREFIX = '../';

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        const TABS = {
            competitions: {
                file: 'competitions',
                badge: 'Competition',
                intro: 'Competitions held at school. Watch the announcements and meet the winners.',
                empty: 'No school competitions yet'
            },
            contests: {
                file: 'contest',
                badge: 'Contest',
                intro: 'Contests where students send in photos, stories and other work.',
                empty: 'No contests yet'
            }
        };
        const cache = {};

        function renderCard(item, badge) {
            const href = `article.html?id=${encodeURIComponent(item.id)}`;
            const imageUrl = item.image ? `${PREFIX}assets/images/content/${item.image}` : '';

            return `
                <a href="${href}" class="contest-card">
                    <div class="contest-card-image">
                        ${imageUrl ? `<img src="${imageUrl}" alt="${escapeHtml(item.title)}" onerror="this.style.display='none'">` : ''}
                        <span class="contest-card-badge">${escapeHtml(badge)}</span>
                    </div>
                    <div class="contest-card-body">
                        <h3 class="contest-card-title">${escapeHtml(item.title)}</h3>
                        <p class="contest-card-excerpt">${escapeHtml(item.excerpt)}</p>
                        <div class="contest-card-meta">
                            <span>${escapeHtml(item.date)}</span>
                        </div>
                    </div>
                </a>
            `;
        }

        async function loadItems(file) {
            if (cache[file]) return cache[file];
            const res = await fetch(`${PREFIX}data/${file}.json?v=` + Date.now());
            if (!res.ok) throw new Error('Failed');
            const data = await res.json();
            cache[file] = data.items || [];
            return cache[file];
        }

        async function showTab(name) {
            const tab = TABS[name] ? name : 'competitions';
            const cfg = TABS[tab];
            const grid = document.getElementById('contests-grid');
            document.querySelectorAll('.contest-tab').forEach(btn => {
                const on = btn.dataset.tab === tab;
                btn.classList.toggle('active', on);
                btn.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            document.getElementById('contest-tab-intro').textContent = cfg.intro;

            try {
                const items = await loadItems(cfg.file);
                grid.innerHTML = items.length
                    ? items.map(item => renderCard(item, cfg.badge)).join('')
                    : `<div class="empty-state"><h3>${cfg.empty}</h3></div>`;
            } catch (err) {
                grid.innerHTML = '<div class="empty-state"><h3>Error loading this list</h3></div>';
            }
        }

        function init() {
            document.querySelectorAll('.contest-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    history.replaceState(null, '', '#' + btn.dataset.tab);
                    showTab(btn.dataset.tab);
                });
            });
            window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));
            showTab(location.hash.slice(1));
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>

</body>
</html>
