<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contests | Albayan Times</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/ticker.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/comments.css">
    <link rel="stylesheet" href="../css/contest.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- DYNAMIC HEADER -->
    <div id="site-header"></div>

    <!-- HERO BANNER (Only 1 banner) -->
    <section class="page-hero">
        <div class="container">
            <div class="page-hero-inner">
                <span class="page-hero-label">Celebrating Talent</span>
                <h2 id="contest-hero-title">Our Competitions</h2>
                <p class="page-hero-subtitle" id="contest-hero-subtitle">Explore past winners and submissions.</p>
            </div>
        </div>
    </section>

    <!-- CONTESTS GRID -->
    <section class="contests-section">
        <div class="container">
            <div class="contests-grid" id="contests-grid">
                <!-- Cards injected by script -->
                <div class="empty-state">
                    <h3>Loading contests...</h3>
                </div>
            </div>
        </div>
    </section>

    <!-- DYNAMIC FOOTER -->
    <div id="site-footer"></div>

    <!-- SCRIPTS -->
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/main.js"></script>

    <script>
    (function () {
        'use strict';

        const PREFIX = '../';

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderContestCard(contest) {
            const href = `article.html?id=${encodeURIComponent(contest.id)}`;
            const imageUrl = contest.image ? `${PREFIX}assets/images/content/${contest.image}` : '';

            return `
                <a href="${href}" class="contest-card">
                    <div class="contest-card-image">
                        ${imageUrl ? `<img src="${imageUrl}" alt="${escapeHtml(contest.title)}" onerror="this.style.display='none'">` : ''}
                        <span class="contest-card-badge">Contest</span>
                    </div>
                    <div class="contest-card-body">
                        <h3 class="contest-card-title">${escapeHtml(contest.title)}</h3>
                        <p class="contest-card-excerpt">${escapeHtml(contest.excerpt)}</p>
                        <div class="contest-card-meta">
                            <span>${escapeHtml(contest.date)}</span>
                        </div>
                    </div>
                </a>
            `;
        }

        async function init() {
            const grid = document.getElementById('contests-grid');
            if (!grid) return;

            try {
                const res = await fetch(`${PREFIX}data/contest.json?v=` + Date.now());
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();

                if (data.intro) {
                    document.getElementById('contest-hero-title').textContent = data.intro.title || 'Contests';
                    document.getElementById('contest-hero-subtitle').textContent = data.intro.subtitle || '';
                }

                const items = data.items || [];
                if (items.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><h3>No contests yet</h3></div>';
                    return;
                }

                grid.innerHTML = items.map(renderContestCard).join('');
            } catch (err) {
                grid.innerHTML = '<div class="empty-state"><h3>Error loading contests</h3></div>';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>

</body>
</html>
