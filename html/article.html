<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | The Open Albayan Times</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/ticker.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/comments.css">
    <link rel="stylesheet" href="../css/article.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- DYNAMIC HEADER -->
    <div id="site-header"></div>

    <!-- BREADCRUMBS -->
    <section class="breadcrumbs">
        <div class="container">
            <ul class="breadcrumbs-list">
                <li><a href="../index.html">Home</a></li>
                <li><a href="#" id="detail-crumb-section">Content</a></li>
                <li class="current" id="detail-crumb-current">Loading...</li>
            </ul>
        </div>
    </section>

    <!-- DETAIL HEADER -->
    <section class="detail-header">
        <div class="container">
            <div class="detail-header-inner">

                <span class="detail-badge" id="detail-badge">Loading</span>

                <h1 class="detail-title" id="detail-title">Loading...</h1>

                <div class="detail-meta" id="detail-meta">
                    <!-- Filled by article-loader.js -->
                </div>

            </div>
        </div>
    </section>

    <!-- DETAIL CONTENT -->
    <section class="detail-wrapper">
        <div class="container">
            <div class="detail-container" id="detail-content">
                <!-- Filled by article-loader.js based on item.type -->
                <div class="empty-state">
                    <h3>Loading content...</h3>
                </div>
            </div>

            <!-- SHARE BAR -->
            <div class="detail-share">
                <span class="detail-share-label">Share this</span>
                <div class="share-buttons">
                    <a href="#" class="share-btn" onclick="return shareTo('facebook')">Facebook</a>
                    <a href="#" class="share-btn" onclick="return shareTo('twitter')">Twitter</a>
                    <a href="#" class="share-btn" onclick="return shareTo('whatsapp')">WhatsApp</a>
                    <button class="share-btn" type="button" onclick="copyLink()">Copy Link</button>
                </div>
            </div>
        </div>
    </section>

    <!-- COMMENTS -->
    <section class="comments-wrapper">
        <div class="container">
            <div class="comments-header">
                <h2>Comments</h2>
                <p>Share your thoughts with the Albayan community.</p>
            </div>
            <div class="comments-placeholder" id="site-comments">
                <h3 class="comments-placeholder-title">Comments Coming Soon</h3>
                <p class="comments-placeholder-text">
                    We're setting up a space for students and visitors to leave comments. Stay tuned!
                </p>
            </div>
        </div>
    </section>

    <!-- DYNAMIC FOOTER -->
    <div id="site-footer"></div>

    <!-- SHARE HELPERS -->
    <script>
        function shareTo(platform) {
            const url = encodeURIComponent(window.location.href);
            const title = encodeURIComponent(document.title);
            let shareUrl = '';

            if (platform === 'facebook') {
                shareUrl = 'https://www.facebook.com/sharer/sharer.php?u=' + url;
            } else if (platform === 'twitter') {
                shareUrl = 'https://twitter.com/intent/tweet?url=' + url + '&text=' + title;
            } else if (platform === 'whatsapp') {
                shareUrl = 'https://wa.me/?text=' + title + '%20' + url;
            }

            if (shareUrl) {
                window.open(shareUrl, '_blank', 'width=600,height=500');
            }
            return false;
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = event.target;
                const original = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = original; }, 2000);
            });
        }
    </script>

    <!-- SCRIPTS -->
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/article-loader.js"></script>

</body>
</html>
